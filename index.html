<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Athletics</title>

  <!-- viewport-fit=cover : l'app s'étend sous l'encoche ; les marges sont gérées en CSS (zones sûres) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Suivi personnel de transformation physique : check-in, séances, corps, bilan.">
  <meta name="theme-color" content="#0F1115">
  <meta name="color-scheme" content="dark">

  <!-- PWA : manifest + réglages spécifiques iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Athletics">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- Empêche iOS de transformer les nombres en liens téléphoniques -->
  <meta name="format-detection" content="telephone=no">

  <!-- Polices auto-hébergées (Inter Tight et Big Shoulders Display, licence SIL OFL) : hors ligne, sans service tiers -->
  <link rel="preload" href="fonts/inter-tight-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- En-tête : titre de l'écran courant -->
  <header class="entete">
    <h1 class="entete__titre" id="titre-ecran">Aujourd'hui</h1>
    <p class="entete__sous-titre" id="sur-titre"></p>
  </header>

  <!-- Bandeau hors ligne (affiché par JS) -->
  <div class="bandeau" id="bandeau-hors-ligne" hidden>Hors ligne — tout continue de fonctionner.</div>

  <!-- Contenu de l'écran courant, rendu par js/app.js -->
  <main class="contenu" id="contenu" tabindex="-1"></main>

  <!-- Navigation basse : barre flottante, atteignable au pouce (libellés lus par VoiceOver) -->
  <nav class="onglets" aria-label="Navigation principale">
    <a class="onglet" href="#/aujourdhui" data-route="aujourdhui">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <span>Aujourd'hui</span>
    </a>
    <a class="onglet" href="#/seances" data-route="seances">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M6 8v8M18 8v8M9 6v12M15 6v12"/></svg>
      <span>Séances</span>
    </a>
    <a class="onglet" href="#/corps" data-route="corps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg>
      <span>Corps</span>
    </a>
    <a class="onglet" href="#/bilan" data-route="bilan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>
      <span>Bilan</span>
    </a>
    <a class="onglet" href="#/reglages" data-route="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Réglages</span>
    </a>
  </nav>

  <noscript><p style="padding:24px">Cette application a besoin de JavaScript pour fonctionner.</p></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
