# Vérification automatique : lance toutes les suites de tests à chaque mise à jour.
# Résultat visible dans l'onglet « Actions » du dépôt (coche verte ou croix rouge sur chaque commit).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright et Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Lancer les tests
        run: python tests/lancer.py

      - name: Garder les captures d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/captures/
